<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFW — Multijugador</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#e0e0e0;font-family:monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px}
h1{color:#e94560;margin-bottom:8px;font-size:22px}
.sub{color:#4fc3f7;margin-bottom:24px;font-size:12px}
.panel{background:#16213e;border:1px solid #333;border-radius:6px;padding:20px;width:420px;margin-bottom:16px}
.panel h2{color:#4fc3f7;font-size:14px;margin-bottom:12px}
input,select,button{display:block;width:100%;padding:10px 14px;margin:6px 0;border-radius:4px;border:1px solid #333;font-family:monospace;font-size:13px}
input,select{background:#0f3460;color:#e0e0e0}
button{background:#e94560;color:#fff;border:none;cursor:pointer;font-weight:bold;font-size:14px;transition:background .2s}
button:hover{background:#c0392b}
button.secondary{background:#0f3460;color:#4fc3f7;border:1px solid #4fc3f7}
button.secondary:hover{background:#1a3a5c}
.code{text-align:center;font-size:32px;font-weight:bold;color:#ffd700;letter-spacing:6px;margin:16px 0}
.status{text-align:center;color:#888;font-size:11px;margin-top:8px}
.error{color:#e94560;font-size:11px;margin-top:4px}
.hidden{display:none}
.deck-option{display:block;width:100%;padding:8px 12px;margin:4px 0;background:#0f3460;color:#e0e0e0;border:1px solid #333;border-radius:4px;cursor:pointer;text-align:left;font-family:monospace;font-size:12px}
.deck-option:hover{background:#1a3a5c;border-color:#4fc3f7}
.deck-option.selected{border-color:#e94560;background:#2a1a2e}
.wait-msg{color:#888;font-style:italic;font-size:13px}
</style>
</head>
<body>

<h1>Network Fantasy War</h1>
<div class="sub">Modo Multijugador Online</div>

<!-- Phase 1: Mode selection -->
<div id="phase-mode" class="panel">
  <h2>Elige como jugar</h2>
  <button onclick="showSolo()" style="background:#1a3a1a;border-color:#4caf50;color:#4caf50">Jugar vs IA</button>
  <button onclick="showCreate()">Crear sala (2 jugadores)</button>
  <button class="secondary" onclick="showJoin()">Unirse a sala</button>
  <div style="margin-top:12px;display:flex;gap:6px">
    <button onclick="window.open('/rules','_blank')" style="flex:1;background:#0f3460;color:#4fc3f7;font-size:11px;padding:6px">📜 Reglas (PDF)</button>
    <button onclick="showDecks()" style="flex:1;background:#0f3460;color:#ffd700;font-size:11px;padding:6px">📚 Ver Decks</button>
  </div>
</div>

<!-- Decks modal -->
<div id="decks-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:100;overflow-y:auto;padding:20px">
  <div style="max-width:700px;margin:20px auto;background:#16213e;border:1px solid #e94560;border-radius:8px;padding:20px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h2 style="color:#e94560;margin:0">📚 Todos los Decks</h2>
      <button onclick="document.getElementById('decks-modal').style.display='none'" style="background:none;border:1px solid #e94560;color:#e94560;padding:4px 12px;cursor:pointer;border-radius:4px;font-size:16px">✕</button>
    </div>
    <div id="decks-content" style="color:#aaa;font-size:11px">Cargando...</div>
  </div>
</div>

<!-- Create room -->
<div id="phase-create" class="panel hidden">
  <h2>Crear Sala</h2>
  <div id="deck-options-host"></div>
  <button onclick="createRoom()" id="btn-create" disabled>Crear sala</button>
  <button class="secondary" onclick="back()">Volver</button>
</div>

<!-- Waiting room (host) -->
<div id="phase-waiting" class="panel hidden">
  <h2>Sala Creada</h2>
  <p class="wait-msg" style="text-align:center">Comparte este codigo con tu oponente:</p>
  <div class="code" id="room-code-display"></div>
  <p class="status" id="wait-msg">Esperando oponente...</p>
</div>

<!-- Solo vs AI -->
<div id="phase-solo" class="panel hidden">
  <h2>Jugar vs IA</h2>
  <div id="deck-options-solo"></div>
</div>

<!-- Join room -->
<div id="phase-join" class="panel hidden">
  <h2>Unirse a Sala</h2>
  <input type="text" id="join-code" placeholder="Codigo de 4 letras/digitos" maxlength="4" autocomplete="off" style="text-align:center;font-size:20px;letter-spacing:4px">
  <div id="deck-options-joiner"></div>
  <button onclick="joinRoom()" id="btn-join" disabled>Unirse</button>
  <button class="secondary" onclick="back()">Volver</button>
  <div class="error" id="join-error"></div>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
const socket = io();
let selectedDeckHost = null;
let selectedDeckJoiner = null;
let decksData = null;

// Load decks
fetch('/api/decks')
  .then(r => r.json())
  .then(d => {
    decksData = d;
    renderDecks('deck-options-host', k => {
      selectedDeckHost = k;
      document.querySelectorAll('#deck-options-host .deck-option').forEach(el => el.classList.remove('selected'));
      event.target.classList.add('selected');
      document.getElementById('btn-create').disabled = false;
    });
    renderDecks('deck-options-joiner', k => {
      selectedDeckJoiner = k;
      document.querySelectorAll('#deck-options-joiner .deck-option').forEach(el => el.classList.remove('selected'));
      event.target.classList.add('selected');
      document.getElementById('btn-join').disabled = false;
    });
  });

function renderDecks(containerId, onPick) {
  if (!decksData) return;
  const keys = Object.keys(decksData);
  const div = document.getElementById(containerId);
  div.innerHTML = '<p style="color:#888;font-size:11px;margin-bottom:4px">Elige tu mazo:</p>';
  keys.forEach(k => {
    const btn = document.createElement('div');
    btn.className = 'deck-option';
    btn.textContent = decksData[k].name + ' (' + decksData[k].count + ' cartas)';
    btn.onclick = () => onPick(k);
    div.appendChild(btn);
  });
}

function showCreate() {
  document.getElementById('phase-mode').classList.add('hidden');
  document.getElementById('phase-create').classList.remove('hidden');
}

function showJoin() {
  document.getElementById('phase-mode').classList.add('hidden');
  document.getElementById('phase-join').classList.remove('hidden');
}

function back() {
  document.querySelectorAll('.panel').forEach(p => p.classList.add('hidden'));
  document.getElementById('phase-mode').classList.remove('hidden');
}

function createRoom() {
  if (!selectedDeckHost) return;
  socket.emit('create_room', {deck: selectedDeckHost});
}

function joinRoom() {
  const code = document.getElementById('join-code').value.trim().toUpperCase();
  if (!code || !selectedDeckJoiner) return;
  socket.emit('join_room', {code: code, deck: selectedDeckJoiner});
}

// Solo vs AI
let selectedDeckSolo = null;

function showSolo() {
  document.getElementById('phase-mode').classList.add('hidden');
  document.getElementById('phase-solo').classList.remove('hidden');
  if (!decksData) return;
  const keys = Object.keys(decksData);
  const div = document.getElementById('deck-options-solo');
  div.innerHTML = '<p style="color:#888;font-size:11px;margin-bottom:4px">Elige tu mazo:</p>';
  keys.forEach(k => {
    const btn = document.createElement('div');
    btn.className = 'deck-option';
    btn.textContent = decksData[k].name + ' (' + decksData[k].count + ' cartas)';
    btn.onclick = () => {
      selectedDeckSolo = k;
      document.querySelectorAll('#deck-options-solo .deck-option').forEach(el => el.classList.remove('selected'));
      btn.classList.add('selected');
      createSoloRoom();
    };
    div.appendChild(btn);
  });
}

function createSoloRoom() {
  if (!selectedDeckSolo) return;
  socket.emit('create_solo_room', {deck: selectedDeckSolo});
}

// Socket events
socket.on('room_created', data => {
  document.getElementById('phase-create').classList.add('hidden');
  document.getElementById('phase-waiting').classList.remove('hidden');
  document.getElementById('room-code-display').textContent = data.code;
});

socket.on('opponent_joined', data => {
  // Both players: redirect to game
  // Pass room code + player_id via sessionStorage
  sessionStorage.setItem('nfw_room_code', document.getElementById('room-code-display').textContent);
  sessionStorage.setItem('nfw_player_id', '0');
  window.location.href = '/mp-game';
});

socket.on('room_joined', data => {
  sessionStorage.setItem('nfw_room_code', data.code);
  sessionStorage.setItem('nfw_player_id', '1');
  window.location.href = '/mp-game';
});

socket.on('solo_started', data => {
  sessionStorage.setItem('nfw_room_code', data.room_code);
  sessionStorage.setItem('nfw_player_id', data.player_id);
  window.location.href = '/mp-game?code=' + data.room_code + '&pid=' + data.player_id;
});

socket.on('error', data => {
  document.getElementById('join-error').textContent = data.message;
});

socket.on('state_update', data => {
  // Handled on the game page
});

async function showDecks() {
  const modal = document.getElementById('decks-modal');
  const content = document.getElementById('decks-content');
  modal.style.display = 'block';
  content.innerHTML = 'Cargando...';
  try {
    const r = await fetch('/api/decks');
    const decks = await r.json();
    let html = '';
    for (const [key, d] of Object.entries(decks)) {
      const colorTags = Object.entries(d.colors).map(([c, n]) => 
        '<span style="color:#4fc3f7">' + c + '</span>:' + n).join(' ');
      html += '<div class="deck-item" data-deck="' + key + '" style="background:#0f3460;border:1px solid #333;border-radius:4px;padding:10px;margin:6px 0;cursor:pointer" onclick="toggleDeckDetail(\'' + key + '\', this)">' +
        '<strong style="color:#e94560;font-size:13px">' + d.name + '</strong>' +
        '<span style="color:#888;font-size:10px;margin-left:8px">(' + key + ' · ' + d.count + ' cartas)</span>' +
        '<div style="margin-top:4px;color:#aaa;font-size:10px">' +
          'V prom: ' + d.avg_v + ' | D prom: ' + d.avg_d + ' | Espías: ' + d.spies + ' | Logistrones: ' + d.logistrones +
        '</div>' +
        '<div style="color:#888;font-size:9px;margin-top:2px">' + colorTags + '</div>' +
        '<div class="deck-cards" id="deck-cards-' + key + '" style="display:none;margin-top:8px;border-top:1px solid #333;padding-top:6px"></div>' +
      '</div>';
    }
    content.innerHTML = html;
  } catch(e) {
    content.innerHTML = '<span style="color:#e94560">Error al cargar decks.</span>';
  }
}

async function toggleDeckDetail(key, el) {
  const cardsDiv = document.getElementById('deck-cards-' + key);
  if (cardsDiv.style.display === 'block') {
    cardsDiv.style.display = 'none';
    return;
  }
  if (cardsDiv.innerHTML) {
    cardsDiv.style.display = 'block';
    return;
  }
  cardsDiv.innerHTML = '<span style="color:#888">Cargando cartas...</span>';
  cardsDiv.style.display = 'block';
  try {
    const r = await fetch('/api/decks/' + key);
    const deck = await r.json();
    let html = '';
    const colorMap = {
      'Saboteador': '#e94560', 'Espía': '#9b59b6', 'Monstruo': '#e67e22',
      'Militar': '#3498db', 'Guerrero': '#e74c3c', 'Sellador': '#f1c40f',
      'Festivo': '#1abc9c', 'Político': '#2ecc71', 'Incoloro': '#95a5a6',
      'Naturaleza': '#27ae60', 'Alquimista': '#8e44ad', 'Sabio': '#2980b9',
      'Logistrón': '#7f8c8d'
    };
    for (const c of deck.cards) {
      const clr = colorMap[c.color] || '#aaa';
      const tags = [];
      if (c.is_spy) tags.push('🕵️ Espía');
      if (c.is_logistron) tags.push('🔌 Logistrón');
      const ab = c.abilities.length ? '<div style="color:#888;font-size:8px;margin-top:1px">' + c.abilities.map(a => a.substring(0,60)).join('<br>') + '</div>' : '';
      html += '<div style="background:#0a1a2e;border:1px solid #222;border-radius:3px;padding:5px 8px;margin:3px 0;font-size:10px">' +
        '<span style="color:' + clr + ';font-weight:bold">' + c.name + '</span>' +
        ' <span style="color:#888">HP:' + c.hp + ' D:' + c.d + ' V:' + c.v + ' L:' + c.layers.join(',') + '</span>' +
        (tags.length ? ' <span style="color:#4fc3f7;font-size:9px">' + tags.join(' ') + '</span>' : '') +
        ab + '</div>';
    }
    cardsDiv.innerHTML = html;
  } catch(e) {
    cardsDiv.innerHTML = '<span style="color:#e94560">Error al cargar.</span>';
  }
}
</script>
</body>
</html>
