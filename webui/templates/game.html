<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Network Fantasy War</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#e0e0e0;font-family:monospace;font-size:11px;overflow-x:hidden;transition:background .3s}
body.p0-turn{background:#1a1a2e}
body.p1-turn{background:#1a2e1a}
#app{max-width:1400px;margin:0 auto;padding:8px;position:relative}
.header{background:#16213e;padding:8px 16px;border-radius:4px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.header h1{color:#e94560;font-size:16px}
.status{display:flex;gap:16px;font-size:12px}
.status span{padding:4px 8px;background:#0f3460;border-radius:3px}
.status .active{background:#e94560;color:#fff}

#board-container{position:relative;margin-bottom:8px}
#board-container svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:20}
#board-container svg line{stroke:#ffd700;stroke-width:1.5;opacity:0.6}
#board-container svg line.cross{stroke:#e94560;stroke-width:1;stroke-dasharray:3,3;opacity:0.4}

.territory{display:flex;flex-direction:column;gap:1px}
.territory-label{font-size:10px;color:#888;padding:2px 0}
.row{display:flex;gap:2px;justify-content:center}
.cell{width:110px;height:60px;background:#0f3460;border-radius:2px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px;text-align:center;position:relative;transition:all .15s;z-index:10;overflow:hidden;white-space:nowrap;font-weight:bold}
.cell:hover{background:#1a4a8a}
.cell.occupied{background:#16213e;border:1px solid #333;font-size:13px}
.cell.occupied:hover{border-color:#e94560}
.cell.foreign{background:#3d1620;border-color:#602030}
.cell.selected{border:2px solid #e94560!important;box-shadow:0 0 8px #e94560}
.cell.play-target{border:2px dashed #4fc3f7!important;box-shadow:0 0 6px #4fc3f7;background:#0a2a4a}
.cell.linked-selected{border:1px dashed #ffd700}
.cell .hp{position:absolute;bottom:1px;right:2px;font-size:7px;color:#888}
.cell .vused{position:absolute;top:1px;right:2px;font-size:7px;color:#4fc3f7}
.frontier{background:#2d1f0a;padding:4px 8px;border-radius:2px;text-align:center;font-size:10px;margin:2px 0;position:relative;z-index:10}
.frontier .spy{display:inline-block;padding:2px 6px;background:#602030;border-radius:2px;margin:0 2px;cursor:pointer}
.frontier .spy:hover{background:#803040}

#card-detail{position:fixed;bottom:8px;right:8px;background:#16213e;border:1px solid #e94560;border-radius:4px;padding:12px;max-width:280px;z-index:50;display:none;font-size:11px}
#card-detail h3{color:#e94560;margin-bottom:4px}
#card-detail .stat{color:#4fc3f7}
#card-detail .ability{color:#aaa;margin:2px 0;padding-left:8px;border-left:2px solid #333}
#card-detail .ability-btn{display:block;width:100%;margin:3px 0;padding:4px 8px;background:#1a3a1a;color:#4fc3f7;border:1px solid #4fc3f7;border-radius:3px;cursor:pointer;font-family:monospace;font-size:10px;text-align:left}
#card-detail .ability-btn:hover{background:#2a5a2a;border-color:#7fdf7f}
#card-detail .ability-btn[disabled]{opacity:0.4;cursor:default}
#card-detail .ability-passive{color:#888;margin:2px 0;padding-left:8px;border-left:2px solid #333;font-size:10px}
#card-detail .close{position:absolute;top:4px;right:8px;cursor:pointer;color:#888}
#card-detail .close:hover{color:#e94560}

#hand{background:#16213e;padding:8px;border-radius:4px;margin-bottom:8px;min-height:60px}
#hand h3{font-size:11px;margin-bottom:4px;color:#888}
.hand-cards{display:flex;gap:4px;flex-wrap:wrap}
.hand-card{padding:4px 8px;background:#0f3460;border-radius:3px;cursor:pointer;font-size:10px;min-width:160px;max-width:220px;text-align:center}
.hand-card:hover{background:#1a4a8a}
.hand-card.selected{border:2px solid #e94560}
.hand-card .name{font-weight:bold}
.hand-card .stats{font-size:8px;color:#aaa}
.hand-card .abilities{font-size:7px;color:#888;margin-top:2px;text-align:left}

#controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
#player-indicator{padding:6px 12px;background:#e94560;color:#fff;border-radius:3px;font-size:11px;display:none}
.btn{padding:6px 12px;background:#0f3460;color:#e0e0e0;border:none;border-radius:3px;cursor:pointer;font-family:monospace;font-size:11px}
.btn:hover{background:#1a4a8a}
.btn.primary{background:#e94560}
.btn.primary:hover{background:#ff6b81}
.btn:disabled{opacity:.4;cursor:default}

#log{background:#16213e;padding:8px;border-radius:4px;max-height:120px;overflow-y:auto;font-size:10px}
#log .entry{padding:2px 0;border-bottom:1px solid #0f3460}

#deck-select{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:100}
#deck-select>div{background:#16213e;padding:24px;border-radius:8px;max-width:500px;text-align:center}
#deck-select>div.p2-pick{background:#1a3a1a;border:2px solid #4caf50}
#deck-select h2{color:#e94560;margin-bottom:16px}
#deck-select .p2-pick h2{color:#4caf50}
.deck-option{display:block;width:100%;padding:8px 12px;margin:4px 0;background:#0f3460;color:#e0e0e0;border:none;border-radius:4px;cursor:pointer;text-align:left;font-family:monospace;font-size:12px}
.deck-option:hover{background:#1a4a8a}

#victory-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:200}
#victory-overlay>div{background:#16213e;padding:32px;border-radius:8px;text-align:center;border:2px solid #e94560}
#victory-overlay h1{color:#e94560;font-size:28px;margin-bottom:16px}
#victory-overlay .vstat{color:#aaa;font-size:14px;margin:4px 0}
#victory-overlay .vbtn{display:inline-block;margin-top:16px;padding:10px 24px;background:#e94560;color:#fff;border:none;border-radius:4px;cursor:pointer;font-family:monospace;font-size:14px}
#victory-overlay .vbtn:hover{background:#ff6b81}

#squads-panel{background:#16213e;padding:8px;border-radius:4px;margin-bottom:8px;font-size:10px}
.squad-entry{padding:4px 8px;background:#0f3460;border-radius:3px;margin:2px 0;cursor:pointer}
.squad-entry:hover{background:#1a4a8a}
.squad-entry .type{color:#e94560;font-weight:bold}

.phase-actions .phase-attack{display:none}
body.phase-attack .phase-actions{display:none}
body.phase-attack .phase-attack{display:flex}
</style>
</head>
<body class="phase-actions">
<div id="app">
 <div class="header">
  <h1>⚔️ Network Fantasy War</h1>
  <div class="status" id="status-bar"></div>
 </div>
 <div id="player-indicator">Turno de: Jugador 1</div>
 <div id="board-container">
  <svg id="link-svg"></svg>
  <div id="board-inner"></div>
 </div>
 <div id="card-detail">
  <span class="close" onclick="document.getElementById('card-detail').style.display='none'">✕</span>
  <h3 id="detail-name"></h3>
  <div id="detail-stats"></div>
  <div id="detail-abilities"></div>
 </div>
 <div id="hand"><h3>Tu mano</h3><div class="hand-cards" id="hand-cards"></div></div>
 <div id="controls">
  <button class="btn" onclick="action('play')">▶ Jugar carta</button>
  <button class="btn" onclick="action('link')">🔗 Vincular</button>
  <button class="btn" onclick="action('ascend')">⬆ Ascender</button>
  <span class="phase-actions">
   <button class="btn primary" onclick="action('next_phase')">⚔️ Atacar →</button>
  </span>
  <span class="phase-attack">
   <button class="btn" onclick="action('next_phase')">🏁 Finalizar ataque</button>
  </span>
  <button class="btn" onclick="action('end_turn')">⏩ Fin Turno</button>
  <button class="btn" onclick="surrender()" style="background:#8b0000;color:#fff;border-color:#8b0000">🏳️ Rendirse</button>
  <button class="btn" onclick="refresh()">🔄 Refresh</button>
  <button class="btn" onclick="flipBoard()">🔄 Flip</button>
  <button class="btn" onclick="window.open('/rules','_blank')" style="background:#0f3460;color:#4fc3f7;font-size:10px">📜 Reglas</button>
  <button class="btn" onclick="showDecks()" style="background:#0f3460;color:#ffd700;font-size:10px">📚 Decks</button>
  <button class="btn" id="graveyard-btn" onclick="toggleGraveyard()" style="background:#2a1a1a;color:#888;font-size:10px;display:none">💀 Cementerio (<span id="grave-count">0</span>)</button>
</div>
<div id="graveyard-panel" style="display:none;background:#1a1a1a;border:1px solid #444;border-radius:4px;padding:8px;margin-bottom:8px;max-height:200px;overflow-y:auto">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
    <span style="color:#888;font-size:10px;font-weight:bold">💀 Cementerio — solo lectura</span>
    <button onclick="document.getElementById('graveyard-panel').style.display='none'" style="background:none;border:none;color:#888;cursor:pointer;font-size:14px">✕</button>
  </div>
  <div id="graveyard-content" style="color:#888;font-size:10px"></div>
</div>
<div id="squads-panel" class="phase-attack"></div>
 <div id="log"></div>
 </div>

 <!-- Decks modal -->
 <div id="decks-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:100;overflow-y:auto;padding:20px">
   <div style="max-width:700px;margin:20px auto;background:#16213e;border:1px solid #e94560;border-radius:8px;padding:20px">
     <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
       <h2 style="color:#e94560;margin:0">📚 Todos los Decks</h2>
       <button onclick="document.getElementById('decks-modal').style.display='none'" style="background:none;border:1px solid #e94560;color:#e94560;padding:4px 12px;cursor:pointer;border-radius:4px;font-size:16px">✕</button>
     </div>
     <div id="decks-content" style="color:#aaa;font-size:11px">Cargando...</div>
   </div>
 </div>

<div id="victory-overlay">
 <div>
  <h1 id="victory-title">🏆</h1>
  <div class="vstat" id="victory-stats"></div>
  <button class="vbtn" onclick="location.reload()">Nueva partida</button>
 </div>
</div>

<div id="deck-select">
 <div id="mode-select">
  <h2>Network Fantasy War</h2>
  <p style="color:#aaa;margin-bottom:12px">Elige el modo de juego</p>
  <button class="deck-option" onclick="chooseMode('ai')" style="font-size:14px;padding:12px;text-align:center">🤖 1 Jugador vs IA</button>
  <button class="deck-option" onclick="chooseMode('pvp')" style="font-size:14px;padding:12px;text-align:center">👥 2 Jugadores (hotseat)</button>
 </div>
 <div id="deck-pick" style="display:none">
  <h2 id="deck-pick-title">Selecciona tu mazo</h2>
  <div id="deck-options">Cargando...</div>
 </div>
</div>

<script>
let state = null;
let selectedBoard = null;
let selectedHand = null;
let linkTarget = null;
let playerDeck1 = null;
let playerDeck2 = null;
let gameMode = null;
let decksData = null;
let playTarget = null;
let flipped = false;  // board orientation

async function api(url, body) {
  const opts = body ? {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)} : {};
  const r = await fetch(url, opts);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

async function chooseMode(mode) {
  gameMode = mode;
  document.getElementById('mode-select').style.display = 'none';
  document.getElementById('deck-pick').style.display = 'block';
  try {
    decksData = await api('/api/decks');
    const keys = Object.keys(decksData);
    if (!keys.length) {
      document.getElementById('deck-options').innerHTML = '<p style="color:#e94560">Error al cargar mazos.</p>';
      return;
    }
    if (mode === 'ai') {
      document.getElementById('deck-pick-title').textContent = 'Selecciona tu mazo (J1)';
      renderDeckPicker(keys, (k) => {
        playerDeck1 = k;
        playerDeck2 = keys.filter(x => x !== k)[Math.floor(Math.random()*(keys.length-1))];
        startMatch();
      });
    } else {
      document.getElementById('deck-pick-title').textContent = 'Jugador 1 — Selecciona tu mazo';
      renderDeckPicker(keys, (k1) => {
        playerDeck1 = k1;
        document.getElementById('deck-pick-title').textContent = 'Jugador 2 — Selecciona tu mazo';
        document.getElementById('deck-pick').classList.add('p2-pick');
        renderDeckPicker(keys, (k2) => {
          playerDeck2 = k2;
          startMatch();
        });
      });
    }
  } catch(e) {
    document.getElementById('deck-options').innerHTML = '<p style="color:#e94560">Error: ' + e.message + '</p>';
  }
}

function renderDeckPicker(keys, onPick) {
  const div = document.getElementById('deck-options');
  div.innerHTML = '';
  for (const k of keys) {
    const v = decksData[k];
    const btn = document.createElement('button');
    btn.className = 'deck-option';
    btn.textContent = '[' + v.count + '] ' + v.name;
    btn.onclick = () => onPick(k);
    div.appendChild(btn);
  }
}

async function startMatch() {
  document.getElementById('deck-select').style.display = 'none';
  try {
    const r = await api('/api/new_game', {deck1: playerDeck1, deck2: playerDeck2});
    loadState(r.state);
  } catch(e) {
    const m = 'Error al iniciar: ' + e.message + '. ¿Está corriendo el servidor? python -m webui.app';
    alert(m); logError(m);
  }
}

function loadState(s) {
  state = s;
  document.body.className = 'phase-' + s.phase + ' p' + s.active_player + '-turn';
  renderBoard(s);
  renderLinks(s);
  renderHand(s);
  renderStatus(s);
  renderSquads(s);
  renderLog(s);
  renderGraveyard(s);
  updatePlayerIndicator(s);
}

function updatePlayerIndicator(s) {
  const el = document.getElementById('player-indicator');
  if (!s.game_over) {
    el.style.display = 'block';
    el.textContent = gameMode === 'ai' && s.active_player === 1 ? 'IA está pensando...' : 'Turno de: Jugador ' + (s.active_player + 1);
  } else {
    el.style.display = 'block';
    el.textContent = '🏆 ¡Jugador ' + (s.winner + 1) + ' gana!';
    showVictory(s);
  }
}

function showVictory(s) {
  document.getElementById('victory-title').textContent = '🏆 ¡Jugador ' + (s.winner + 1) + ' gana!';
  document.getElementById('victory-stats').innerHTML = 
    'Turnos: ' + s.turn + '<br>' +
    'Sellos finales — J1: ' + s.seals[0] + ' | J2: ' + s.seals[1] + '<br>' +
    'Cartas en mano — J1: ' + s.hand_sizes[0] + ' | J2: ' + s.hand_sizes[1];
  document.getElementById('victory-overlay').style.display = 'flex';
}

// ═══ RENDER BOARD ═══
function renderBoard(s) {
  const c = document.getElementById('board-inner');
  const top = flipped ? 0 : 1;   // flipped: J1 on top
  const bot = flipped ? 1 : 0;
  let h = '';
  h += territoryHtml(top, s.seals[top], s);
  h += frontierHtml(s);
  h += territoryHtml(bot, s.seals[bot], s);
  
  c.innerHTML = h;
  if (selectedBoard && s.links[selectedBoard]) {
    s.links[selectedBoard].forEach(cid => {
      const el = document.querySelector('[data-cid="' + cid + '"]');
      if (el) el.classList.add('linked-selected');
    });
  }
}

function territoryHtml(player, seals, s) {
  let h = '<div class="territory"><div class="territory-label">J' + (player+1) + ' — Sellos: ' + seals + '</div>';
  for (let dl = 1; dl <= 3; dl++) {
    h += '<div class="row">';
    for (let m = 0; m < 15; m++) h += cellHtml(player, dl, m, s);
    h += '</div>';
  }
  h += '</div>';
  return h;
}

function frontierHtml(s) {
  let h = '<div class="frontier">══ FRONTERA ══ ';
  if (s.board.frontier.length) {
    s.board.frontier.forEach(sp => {
      h += '<span class="spy" onclick="selectBoard(' + sp.id + ')">' + sp.name.substring(0,10) + ' (J' + (sp.owner+1) + ')</span>';
    });
  }
  h += '</div>';
  return h;
}

function cellHtml(player, layer, m, s) {
  const pkey = 'p' + player;
  // Layer mapping depends on player position on screen:
  // When player is at TOP of screen: displayLayer 1=L1, 2=L2, 3=L3
  // When player is at BOTTOM: displayLayer 1=L3, 2=L2, 3=L1
  // Player at top = (player==1 && !flipped) || (player==0 && flipped)
  const playerAtTop = flipped ? player === 0 : player === 1;
  const gameLayer = playerAtTop ? layer : 4 - layer;
  const actualLayer = gameLayer - 1;
  const cell = s.board[pkey][actualLayer][m];
  const isPT = playTarget && playTarget.player === player && playTarget.gameLayer === gameLayer && playTarget.meridian === m;
  if (!cell) {
    const cls = isPT ? 'cell play-target' : 'cell';
    return '<div class="' + cls + '" onclick="selectBoardCell(' + player + ',' + gameLayer + ',' + m + ')" title="J' + (player+1) + ' L' + gameLayer + ':' + m + '"></div>';
  }
  const cls = cell.foreign ? 'cell occupied foreign' : 'cell occupied';
  const sel = selectedBoard === cell.id ? ' selected' : '';
  const hpPct = cell.max_hp > 0 ? Math.round(cell.hp/cell.max_hp*100) : 100;
  return '<div class="' + cls + sel + '" data-cid="' + cell.id + '" onclick="showCardDetail(' + cell.id + ')" title="' + cell.name + ' | ' + cell.color + ' | HP:' + cell.hp + '/' + cell.max_hp + ' | D:' + cell.d + ' | V:' + cell.v_used + '/' + cell.v + '">' + cell.short + '<span class="vused">' + cell.v_used + '/' + cell.v + '</span><span class="hp" style="color:' + (hpPct<50?'#e94560':'#888') + '">' + cell.hp + '</span></div>';
}

// ═══ SVG LINKS ═══
function renderLinks(s) {
  const svg = document.getElementById('link-svg');
  const container = document.getElementById('board-container');
  if (!s.links_pairs || !s.links_pairs.length) { svg.innerHTML = ''; return; }
  
  function draw() {
    const rect = container.getBoundingClientRect();
    const boardInner = document.getElementById('board-inner');
    if (!boardInner) return;
    const innerRect = boardInner.getBoundingClientRect();
    
    svg.setAttribute('width', innerRect.width);
    svg.setAttribute('height', innerRect.height);
    svg.style.top = (innerRect.top - rect.top) + 'px';
    svg.style.left = (innerRect.left - rect.left) + 'px';
    
    let lines = '';
    s.links_pairs.forEach(lp => {
      const elA = document.querySelector('[data-cid="' + lp.from + '"]');
      const elB = document.querySelector('[data-cid="' + lp.to + '"]');
      if (!elA || !elB) return;
      const ra = elA.getBoundingClientRect();
      const rb = elB.getBoundingClientRect();
      const x1 = ra.left + ra.width/2 - innerRect.left;
      const y1 = ra.top + ra.height/2 - innerRect.top;
      const x2 = rb.left + rb.width/2 - innerRect.left;
      const y2 = rb.top + rb.height/2 - innerRect.top;
      const cls = lp.p0 !== lp.p1 ? ' cross' : '';
      lines += '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" class="' + cls + '"/>';
    });
    svg.innerHTML = lines;
  }
  
  // Draw after DOM settles, and redraw on resize
  setTimeout(draw, 50);
  window._lastDrawFn = draw;
}

// Redraw links on window resize/zoom
window.addEventListener('resize', () => {
  if (window._lastDrawFn) window._lastDrawFn();
});

// ═══ CARD DETAIL PANEL ═══
function showCardDetail(cid) {
  selectBoard(cid);
  const panel = document.getElementById('card-detail');
  // Find card in board data
  let card = null;
  for (const pk of ['p0','p1']) {
    for (const row of state.board[pk]) {
      for (const c of row) {
        if (c && c.id === cid) { card = c; break; }
      }
      if (card) break;
    }
    if (card) break;
  }
  if (!card) { panel.style.display = 'none'; return; }
  
  document.getElementById('detail-name').textContent = card.name;
  document.getElementById('detail-stats').innerHTML = 
    '<span class="stat">' + card.color + '</span> | HP:' + card.hp + '/' + card.max_hp + 
    ' | D:' + card.d + ' | V:' + card.v_used + '/' + card.v;
  
  // Parasite indicator
  const attached = state.attached || {};
  const cardIdStr = String(card.id);
  if (attached[cardIdStr]) {
    // This card is a parasite
    const hostId = attached[cardIdStr];
    document.getElementById('detail-stats').innerHTML += 
      '<br><span style="color:#e67e22;font-size:9px">🦠 Adjuntado a carta #' + hostId + '</span>';
  }
  // Check if this card is a host
  for (const [pid, hid] of Object.entries(attached)) {
    if (hid === card.id) {
      document.getElementById('detail-stats').innerHTML += 
        '<br><span style="color:#e94560;font-size:9px">🦠 Parasitado (no puede crear vínculos)</span>';
      break;
    }
  }
  
  const abDiv = document.getElementById('detail-abilities');
  if (card.abilities_meta && card.abilities_meta.length) {
    let abHtml = '';
    card.abilities_meta.forEach((a, i) => {
      if (a.type === 'ACTIVE' && a.cost > 0) {
        const myTurn = state.active_player === 0 || (gameMode !== 'ai');
        const enoughActions = state.actions >= a.cost;
        const canUse = myTurn && enoughActions && state.phase === 'actions';
        const disabled = canUse ? '' : 'disabled';
        abHtml += '<button class="ability-btn" onclick="activateAbility(' + card.id + ',' + i + ')" ' + disabled + ' title="Coste: ' + a.cost + ' acción(es)">⚡ [' + a.cost + '] ' + a.desc.substring(a.desc.indexOf(']')+2) + '</button>';
      } else {
        abHtml += '<div class="ability-passive">' + a.desc + '</div>';
      }
    });
    abDiv.innerHTML = abHtml;
  } else if (card.abilities && card.abilities.length) {
    abDiv.innerHTML = card.abilities.map(a => '<div class="ability">' + a + '</div>').join('');
  } else {
    abDiv.innerHTML = '<div class="ability" style="color:#555">Sin habilidades</div>';
  }
  // Add move buttons ← → for board cards in actions phase
  const myTurn2 = state.active_player === 0 || (gameMode !== 'ai');
  if (myTurn2 && state.phase === 'actions') {
    abDiv.innerHTML += '<div style="margin-top:6px;display:flex;gap:4px">' +
      '<button class="btn" onclick="moveCard(' + card.id + ',-1)" style="font-size:10px;padding:3px 8px">← Izq</button>' +
      '<button class="btn" onclick="moveCard(' + card.id + ',1)" style="font-size:10px;padding:3px 8px">Der →</button>' +
      '</div>';
  }

  panel.style.display = 'block';
}

// ═══ HAND ═══
function renderHand(s) {
  const p = s.active_player;
  const hand = s.hands[p];
  const div = document.getElementById('hand-cards');
  div.innerHTML = '';
  hand.forEach(c => {
    const cls = selectedHand === c.index ? 'hand-card selected' : 'hand-card';
    const spyTag = c.is_spy ? ' 🕵️' : '';
    const logiTag = c.is_logistron ? ' 🔌' : '';
    const abs = c.abilities && c.abilities.length ? '<div class="abilities">' + c.abilities.map(a => '• ' + a).join('<br>') + '</div>' : '';
    const hoverInfo = c.name + ' | ' + c.color + ' | HP:' + c.hp + ' D:' + c.d + ' V:' + c.v + ' | L:' + c.layers.join(',') + ' | ' + c.forms.join('/');
    div.innerHTML += '<div class="' + cls + '" onclick="showHandDetail(' + c.index + ')" title="' + hoverInfo + '"><div class="name">' + c.name + spyTag + logiTag + '</div><div class="stats">' + c.color + ' | HP:' + c.hp + ' D:' + c.d + ' V:' + c.v + ' | L:' + c.layers.join(',') + ' | ' + c.forms.join('/') + '</div>' + abs + '</div>';
  });
  }

function showHandDetail(idx) {
  selectHand(idx);
  const hand = state.hands[state.active_player];
  const c = hand[idx];
  if (!c) return;
  const panel = document.getElementById('card-detail');
  document.getElementById('detail-name').textContent = c.name;
  document.getElementById('detail-stats').innerHTML = 
    '<span class="stat">' + c.color + '</span> | HP:' + c.hp + ' | D:' + c.d + ' | V:' + c.v + ' | L:' + c.layers.join(',') + ' | ' + c.forms.join('/');
  const abDiv = document.getElementById('detail-abilities');
  if (c.abilities && c.abilities.length) {
    abDiv.innerHTML = c.abilities.map(a => '<div class="ability">' + a + '</div>').join('');
  } else {
    abDiv.innerHTML = '<div class="ability" style="color:#555">Sin habilidades</div>';
  }

  panel.style.display = 'block';
}

function selectHand(idx) {
  selectedHand = (selectedHand === idx) ? null : idx;
  document.querySelectorAll('.hand-card.selected').forEach(el => el.classList.remove('selected'));
  if (selectedHand !== null) {
    document.querySelectorAll('.hand-card')[idx]?.classList.add('selected');
  }
}

function selectBoardCell(player, gameLayer, m) {
  selectedBoard = null;
  linkTarget = null;
  document.getElementById('card-detail').style.display = 'none';
  if (playTarget && playTarget.player === player && playTarget.gameLayer === gameLayer && playTarget.meridian === m) {
    playTarget = null;
  } else {
    playTarget = {player, gameLayer, meridian: m};
  }
  renderBoard(state);
}

function selectBoard(cid) {
  if (selectedBoard === cid) {
    // Deselect
    selectedBoard = null;
    linkTarget = null;
    document.getElementById('card-detail').style.display = 'none';
    renderBoard(state);
    return;
  }
  if (linkTarget) {
    // Second card picked — complete the link
    if (cid !== linkTarget) {
      action('link', {card_a: linkTarget, card_b: cid});
    }
    linkTarget = null;
    selectedBoard = null;
    document.getElementById('card-detail').style.display = 'none';
    return;
  }
  selectedBoard = cid;
  linkTarget = null;
  renderBoard(state);
}

function renderStatus(s) {
  document.getElementById('status-bar').innerHTML = '<span>Turno ' + s.turn + '</span><span class="active">J' + (s.active_player+1) + '</span><span>Fase: ' + s.phase + '</span><span>Acciones: ' + s.actions + '</span><span>🃏 J1:' + s.hand_sizes[0] + ' J2:' + s.hand_sizes[1] + '</span>' + '<span>📦 J1:' + (s.deck_sizes?.[0] ?? '?') + ' J2:' + (s.deck_sizes?.[1] ?? '?') + '</span>' + (s.game_over ? '<span class="active">🏆 J' + (s.winner+1) + ' GANA!</span>' : '');
}

function renderSquads(s) {
  const div = document.getElementById('squads-panel');
  const p = s.active_player;
  
  // Defense prompt: pending attack for defender
  if (s.pending_attack) {
    const def = 1 - s.pending_attack.attacker;
    const defSquads = s.squads['p' + def];
    let h = '<div style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:150">';
    h += '<div style="background:#16213e;padding:20px;border-radius:8px;border:2px solid #e94560;max-width:500px;text-align:center">';
    h += '<h3 style="color:#e94560;margin-bottom:8px">🛡️ ¡' + s.pending_attack.squad_type.toUpperCase() + ' enemigo ataca!</h3>';
    h += '<p style="color:#aaa;font-size:11px">J' + (s.pending_attack.attacker+1) + ': ' + s.pending_attack.squad_type + ' | daño base: ' + s.pending_attack.squad_damage + '</p>';
    h += '<p style="color:#aaa;font-size:10px">' + (s.pending_attack.members || []).map(function(m){return m.substring(0,14)}).join(', ') + '</p>';
    h += '<hr style="border-color:#333;margin:8px 0">';
    h += '<p style="color:#4fc3f7;font-weight:bold;margin-bottom:8px">J' + (def+1) + ' — Elige escuadrón defensor:</p>';
    if (defSquads && defSquads.length) {
      defSquads.forEach(function(sq, i) {
        h += '<div class="squad-entry" onclick="defend(' + i + ')" style="margin:3px 0">🛡️ [' + i + '] ' + sq.type + ' | daño:' + sq.damage + ' | ' + sq.members.map(function(m){return m.name.substring(0,12)}).join(', ') + '</div>';
      });
    } else {
      h += '<div style="color:#888;margin:8px 0">Sin escuadrones disponibles</div>';
    }
    h += '<div class="squad-entry" onclick="defend(-1)" style="color:#e94560;margin:8px 0">✕ Sin defensor (daño directo al grimorio)</div>';
    h += '</div></div>';
    div.innerHTML = h;
    div.style.display = 'block';
    return;
  }
  
  // Normal attack phase: show attacker squads
  if (s.phase === 'attack') {
    div.style.display = 'block';
    const squads = s.squads['p' + p];
    div.innerHTML = '<strong>⚔️ Tus escuadrones:</strong>';
    squads.forEach(function(sq, i) {
      div.innerHTML += '<div class="squad-entry" onclick="attackSquad(' + i + ')"><span class="type">[' + i + '] ' + sq.type + '</span> | daño:' + sq.damage + ' | ' + sq.members.map(function(m){return m.name.substring(0,12)}).join(', ') + '</div>';
    });
    return;
  }
  
  div.style.display = 'none';
}

function moveCard(cid, direction) {
  fetch('/api/action', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({action: 'move', args: {card_id: cid, direction: direction}})
  }).then(r => r.json()).then(r => {
    if (r.error) { alert(r.error); logError(r.error); }
    if (r.state) loadState(r.state);
    if (gameMode === 'ai' && r.state && !r.state.game_over && r.state.active_player === 1) {
      setTimeout(runAITurn, 500);
    }
  });
}

function defend(idx) {
  action('defend', {defender_squad_index: idx});
}

function attackSquad(idx) { action('attack', {squad_index: idx, target: 'grimoire'}); }

async function activateAbility(cardId, abilityIndex) {
  const r = await api('/api/action', {action: 'use_ability', args: {card_id: cardId, ability_index: abilityIndex, targets: {}}});
  if (r.error) { alert(r.error); logError(r.error); }
  if (r.state) loadState(r.state);
  // Auto AI turn
  if (gameMode === 'ai' && r.state && !r.state.game_over && r.state.active_player === 1) {
    setTimeout(runAITurn, 500);
  }
}

function renderLog(s) {
  const div = document.getElementById('log');
  if (!s.log || !s.log.length) { div.innerHTML = ''; return; }
  div.innerHTML = s.log.map(e => '<div class="entry">' + e + '</div>').join('');
  div.scrollTop = div.scrollHeight;
}

function logError(msg) {
  const logDiv = document.getElementById('log');
  logDiv.innerHTML = '<div style="color:#e94560;padding:4px;margin:2px;background:#2a0a0a;border-radius:3px">⚠ ' + msg + '</div>' + logDiv.innerHTML;
  logDiv.scrollTop = 0;
}

// ═══ GRAVEYARD ═══
function renderGraveyard(s) {
  const btn = document.getElementById('graveyard-btn');
  const count = document.getElementById('grave-count');
  const p = s.active_player;
  if (!s.discard_piles || !s.discard_piles[p]) {
    btn.style.display = 'none';
    return;
  }
  const pile = s.discard_piles[p];
  count.textContent = pile.length;
  btn.style.display = pile.length > 0 ? 'inline-block' : 'none';
  
  const content = document.getElementById('graveyard-content');
  if (pile.length === 0) {
    content.innerHTML = '<span style="color:#555">Vacío</span>';
  } else {
    const colorMap = {
      'Saboteador':'#e94560','Espía':'#9b59b6','Monstruo':'#e67e22',
      'Militar':'#3498db','Guerrero':'#e74c3c','Sellador':'#f1c40f',
      'Festivo':'#1abc9c','Político':'#2ecc71','Incoloro':'#95a5a6',
      'Naturaleza':'#27ae60','Alquimista':'#8e44ad','Sabio':'#2980b9',
      'Logistrón':'#7f8c8d'
    };
    content.innerHTML = pile.map(c =>
      '<div style="padding:2px 4px;border-bottom:1px solid #222">' +
      '<span style="color:' + (colorMap[c.color] || '#aaa') + '">' + c.name + '</span>' +
      ' <span style="color:#666">HP:' + c.hp + ' D:' + c.d + ' V:' + c.v + '</span>' +
      '</div>'
    ).join('');
  }
}

function toggleGraveyard() {
  const panel = document.getElementById('graveyard-panel');
  panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
}

async function action(act, args={}) {
  if (gameMode === 'ai' && state && state.active_player === 1 && act !== 'defend') { return; }
  if (act === 'play') {
    if (selectedHand === null) { const m='Selecciona una carta de tu mano primero'; alert(m); logError(m); return; }
    if (!playTarget) { const m='Click en celda vacía del tablero'; alert(m); logError(m); return; }
    args = {hand_index: selectedHand, layer: playTarget.gameLayer, meridian: playTarget.meridian};
    playTarget = null;
  }
  if (act === 'ascend') {
    if (selectedBoard === null) { const m='Selecciona una carta en el tablero'; alert(m); logError(m); return; }
    args = {card_id: selectedBoard};
  }
  if (act === 'link') {
    if (!args.card_a && selectedBoard) {
      linkTarget = selectedBoard;
      // selectedBoard stays set so the card remains visually selected
      renderBoard(state);
      return;
    }
  }
  selectedBoard = null; selectedHand = null;
  const r = await api('/api/action', {action: act, args});
  if (r.error) { alert(r.error); logError(r.error); }
  if (r.state) loadState(r.state);
  // AI auto-defend when pending attack targets AI
  if (gameMode === 'ai' && r.state && r.state.pending_attack && r.state.pending_attack.attacker === 0) {
    setTimeout(async () => {
      const r2 = await api('/api/action', {action: 'defend', args: {defender_squad_index: -1}});
      if (r2.state) loadState(r2.state);
    }, 300);
  }
  if (gameMode === 'ai' && r.state && !r.state.game_over && !r.state.pending_attack && r.state.active_player === 1) {
    setTimeout(runAITurn, 500);
  }
}

async function runAITurn() {
  const r = await api('/api/action', {action: 'ai_turn', args: {}});
  if (r.state) loadState(r.state);
}

async function refresh() {
  const r = await api('/api/state');
  if (r.state) loadState(r.state);
}

async function surrender() {
  if (!confirm('¿Rendirse? Tu oponente ganará la partida.')) return;
  const r = await api('/api/action', {action: 'surrender', args: {}});
  if (r.state) loadState(r.state);
}

function flipBoard() {
  flipped = !flipped;
  renderBoard(state);
  setTimeout(() => { if (window._lastDrawFn) window._lastDrawFn(); }, 100);
}

async function showDecks() {
  const modal = document.getElementById('decks-modal');
  const content = document.getElementById('decks-content');
  modal.style.display = 'block';
  content.innerHTML = 'Cargando...';
  try {
    const r = await fetch('/api/decks');
    const decks = await r.json();
    let html = '';
    for (const [key, d] of Object.entries(decks)) {
      const colorTags = Object.entries(d.colors).map(([c, n]) => 
        '<span style="color:#4fc3f7">' + c + '</span>:' + n).join(' ');
      html += '<div class="deck-item" data-deck="' + key + '" style="background:#0f3460;border:1px solid #333;border-radius:4px;padding:10px;margin:6px 0;cursor:pointer" onclick="toggleDeckDetail(\'' + key + '\', this)">' +
        '<strong style="color:#e94560;font-size:13px">' + d.name + '</strong>' +
        '<span style="color:#888;font-size:10px;margin-left:8px">(' + key + ' · ' + d.count + ' cartas)</span>' +
        '<div style="margin-top:4px;color:#aaa;font-size:10px">' +
          'V prom: ' + d.avg_v + ' | D prom: ' + d.avg_d + ' | Espías: ' + d.spies + ' | Logistrones: ' + d.logistrones +
        '</div>' +
        '<div style="color:#888;font-size:9px;margin-top:2px">' + colorTags + '</div>' +
        '<div class="deck-cards" id="deck-cards-' + key + '" style="display:none;margin-top:8px;border-top:1px solid #333;padding-top:6px"></div>' +
      '</div>';
    }
    content.innerHTML = html;
  } catch(e) {
    content.innerHTML = '<span style="color:#e94560">Error al cargar decks.</span>';
  }
}

async function toggleDeckDetail(key, el) {
  const cardsDiv = document.getElementById('deck-cards-' + key);
  if (cardsDiv.style.display === 'block') {
    cardsDiv.style.display = 'none';
    return;
  }
  if (cardsDiv.innerHTML) {
    cardsDiv.style.display = 'block';
    return;
  }
  cardsDiv.innerHTML = '<span style="color:#888">Cargando cartas...</span>';
  cardsDiv.style.display = 'block';
  try {
    const r = await fetch('/api/decks/' + key);
    const deck = await r.json();
    let html = '';
    const colorMap = {
      'Saboteador': '#e94560', 'Espía': '#9b59b6', 'Monstruo': '#e67e22',
      'Militar': '#3498db', 'Guerrero': '#e74c3c', 'Sellador': '#f1c40f',
      'Festivo': '#1abc9c', 'Político': '#2ecc71', 'Incoloro': '#95a5a6',
      'Naturaleza': '#27ae60', 'Alquimista': '#8e44ad', 'Sabio': '#2980b9',
      'Logistrón': '#7f8c8d'
    };
    for (const c of deck.cards) {
      const clr = colorMap[c.color] || '#aaa';
      const tags = [];
      if (c.is_spy) tags.push('🕵️ Espía');
      if (c.is_logistron) tags.push('🔌 Logistrón');
      
      // Build ability list with implementation indicators
      let ab = '';
      if (c.abilities_detail && c.abilities_detail.length) {
        ab = '<div style="color:#888;font-size:8px;margin-top:2px">';
        c.abilities_detail.forEach(a => {
          let dot;
          if (a.status === 'implemented') dot = '<span title="Implementada" style="color:#4caf50">●</span>';
          else if (a.status === 'partial') dot = '<span title="Parcial" style="color:#ff9800">◐</span>';
          else dot = '<span title="No implementada" style="color:#e94560">○</span>';
          ab += dot + ' ' + a.desc + '<br>';
        });
        ab += '</div>';
      } else if (c.abilities && c.abilities.length) {
        ab = '<div style="color:#888;font-size:8px;margin-top:2px">' + c.abilities.join('<br>') + '</div>';
      }
      
      // Implementation badge
      let implBadge = '';
      if (c.total_abilities > 0) {
        const pct = Math.round(c.impl_count / c.total_abilities * 100);
        let badgeColor = '#e94560';
        if (pct === 100) badgeColor = '#4caf50';
        else if (pct >= 50) badgeColor = '#ff9800';
        implBadge = ' <span title="' + c.impl_count + '/' + c.total_abilities + ' habilidades implementadas" style="font-size:8px;background:' + badgeColor + ';color:#000;padding:0 4px;border-radius:2px">' + c.impl_count + '/' + c.total_abilities + '</span>';
      }
      html += '<div style="background:#0a1a2e;border:1px solid #222;border-radius:3px;padding:5px 8px;margin:3px 0;font-size:10px">' +
        '<span style="color:' + clr + ';font-weight:bold">' + c.name + '</span>' + implBadge +
        ' <span style="color:#888">HP:' + c.hp + ' D:' + c.d + ' V:' + c.v + ' L:' + c.layers.join(',') + '</span>' +
        (tags.length ? ' <span style="color:#4fc3f7;font-size:9px">' + tags.join(' ') + '</span>' : '') +
        ab + '</div>';
    }
    cardsDiv.innerHTML = html;
  } catch(e) {
    cardsDiv.innerHTML = '<span style="color:#e94560">Error al cargar.</span>';
  }
}
</script>
